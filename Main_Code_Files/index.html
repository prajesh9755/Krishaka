<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishaka - Farmer & Buyer Marketplace</title>
    <meta name="description" content="Multilingual login, registration, and profile management authentication module for the Krishaka agricultural marketplace with role-based onboarding and secure database storage." />
    <meta property="og:title" content="Krishaka - Farmer & Buyer Marketplace" />
    <meta property="og:description" content="Multilingual login, registration, and profile management authentication module for the Krishaka agricultural marketplace with role-based onboarding and secure database storage." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..800;1,7..72,400..700&family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F4F1E8] text-[#1A1C18] antialiased selection:bg-[#3F6B3A]/20 selection:text-[#1A1C18]">
    <div id="root"></div>

    <!-- Google Translate Container for Full DOM Real-Time Translation -->
    <div id="google_translate_element" aria-hidden="true" style="position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"></div>

    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr,bn,te,ta,kn,gu,pa,ml,or',
            autoDisplay: false
          }, 'google_translate_element');
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
